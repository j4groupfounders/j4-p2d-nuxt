name: J4 P2 batch 4 bounded verification
on:
  push:
    branches: ['j4/p2d-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Project tests
        run: npx vitest run --reporter=json --outputFile=project-tests.json
      - name: Build
        run: npx nuxt build
      - name: Boot and characterize
        run: python3 j4_stage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            project-tests.json
            surface.actual.json
            http-evidence/**
            seed-results.json
            seed-evidence/
          retention-days: 30
